name: Deploy to Render (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-render-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Verify API Binary Build
        run: go build -v -o /dev/null ./cmd/api

  deploy:
    name: Trigger Render Dev Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        env:
          DEV_HOOK: ${{ secrets.RENDER_DEV_DEPLOY_HOOK }}
          STAGING_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          DEFAULT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_DEV_SERVICE_ID || secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "=== Initiating Render Deployment for branch 'dev' (commit: $COMMIT_SHA) ==="

          # 1. Check Deploy Hook URL (Recommended)
          HOOK_URL="${DEV_HOOK:-${STAGING_HOOK:-$DEFAULT_HOOK}}"

          if [ -n "$HOOK_URL" ]; then
            DEPLOY_URL="$HOOK_URL"
            if [[ "$DEPLOY_URL" == *"?"* ]]; then
              DEPLOY_URL="${DEPLOY_URL}&ref=${COMMIT_SHA}"
            else
              DEPLOY_URL="${DEPLOY_URL}?ref=${COMMIT_SHA}"
            fi

            echo "Triggering deploy hook..."
            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPLOY_URL")
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered! (HTTP $HTTP_STATUS)"
              echo "Response: $BODY"
              exit 0
            else
              echo "❌ Render deploy hook failed with HTTP $HTTP_STATUS"
              echo "Response: $BODY"
              exit 1
            fi
          fi

          # 2. Check Render REST API
          if [ -n "$API_KEY" ] && [ -n "$SERVICE_ID" ]; then
            echo "Triggering deployment via Render REST API for service: $SERVICE_ID..."
            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}')

            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered via REST API! (HTTP $HTTP_STATUS)"
              echo "Response: $BODY"
              exit 0
            else
              echo "❌ Render REST API deploy failed with HTTP $HTTP_STATUS"
              echo "Response: $BODY"
              exit 1
            fi
          fi

          # 3. Neither configured - provide actionable guidance
          echo "::error:: No Render deployment credentials configured in GitHub Secrets."
          echo ""
          echo "To enable auto-deploy, configure one of the following in Repository Settings -> Secrets and variables -> Actions:"
          echo "Option A (Deploy Hook - Recommended):"
          echo "  - Secret Name: RENDER_DEV_DEPLOY_HOOK (or RENDER_STAGING_DEPLOY_HOOK / RENDER_DEPLOY_HOOK)"
          echo "  - Value: Deploy Hook URL copied from Render Dashboard -> Your Web Service -> Settings -> Deploy Hook."
          echo ""
          echo "Option B (Render REST API):"
          echo "  - Secret Name: RENDER_API_KEY (from Render Account Settings -> API Keys)"
          echo "  - Secret Name: RENDER_DEV_SERVICE_ID (from your Web Service URL, format: srv-xxxxxxxxxxxxxxxxxxxx)"
          exit 1

