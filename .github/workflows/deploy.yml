name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

permissions: {}

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Deploy Hook
        env:
          TARGET_ENV: ${{ inputs.environment }}
          PROD_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
          STAGING_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          DEFAULT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          HOOK_URL=""
          if [ "$TARGET_ENV" = "staging" ]; then
            HOOK_URL="$STAGING_HOOK"
          elif [ "$TARGET_ENV" = "production" ]; then
            if [ -n "$PROD_HOOK" ]; then
              HOOK_URL="$PROD_HOOK"
            elif [ -n "$DEFAULT_HOOK" ]; then
              HOOK_URL="$DEFAULT_HOOK"
            fi
          fi

          if [ -z "$HOOK_URL" ]; then
            if [ "$TARGET_ENV" = "staging" ]; then
              echo "::error:: No Render staging deploy hook secret configured (RENDER_STAGING_DEPLOY_HOOK)."
            else
              echo "::error:: No Render production deploy hook secret configured (RENDER_PROD_DEPLOY_HOOK or RENDER_DEPLOY_HOOK)."
            fi
            exit 1
          fi

          DEPLOY_URL="$HOOK_URL"
          if [ -n "$COMMIT_SHA" ]; then
            if [[ "$DEPLOY_URL" == *"?"* ]]; then
              DEPLOY_URL="${DEPLOY_URL}&ref=${COMMIT_SHA}"
            else
              DEPLOY_URL="${DEPLOY_URL}?ref=${COMMIT_SHA}"
            fi
          fi

          echo "Triggering Render $TARGET_ENV deployment for commit $COMMIT_SHA..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "::error:: Render deployment trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi
